<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Control de Combustible — Livianos | TECKNOLOGISTIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    /* Identidad corporativa Tecknologistic SGI — guinda + gris carbón (sin azul) */
    --navy:#A93B3C; --navy-dark:#7E2B2C; --blue:#3A3A3A; --blue-light:#EDEDEC;
    --green:#1E7B4D; --green-light:#E5F4EC; --red:#B3261E; --red-light:#FBE9E7;
    --amber:#9A6700; --amber-light:#FFF3D6; --grey:#595959; --grey-light:#F4F5F7;
    --line:#DDDAD2; --white:#fff; --radius:8px;
    --font:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--grey-light);
    font-family:var(--font); color:#1B1F27;}
  #app{display:flex; flex-direction:column; min-height:100vh;}

  header.topbar{background:#fff; color:#1a1a1a; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:2px solid var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.06);}
  header.topbar .brand span{color:var(--grey); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;}
  header.topbar .brand{display:flex; flex-direction:column; align-items:flex-start; line-height:1.25;}
  header.topbar .brand b{font-size:17px; letter-spacing:.3px;}
  header.topbar .brand img{height:34px; width:auto; max-width:220px; object-fit:contain; display:block; margin-bottom:3px;}
  #connBadge{font-size:12px; padding:6px 12px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .conn-on{background:var(--green); color:#fff;}
  .conn-off{background:var(--amber); color:#3a2a00;}

  main{flex:1; padding:16px; padding-bottom:90px; max-width:980px; width:100%; margin:0 auto;}

  /* Bottom nav, big touch targets */
  nav.bottomnav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; box-shadow:0 -2px 10px rgba(0,0,0,.06); z-index:50;}
  nav.bottomnav button{flex:1; border:none; background:none; padding:10px 4px 12px; font-size:12px; color:var(--grey);
    display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:600; min-height:64px;}
  nav.bottomnav button .ic{font-size:22px;}
  nav.bottomnav button.active{color:var(--navy);}
  nav.bottomnav button.active .ic{transform:scale(1.05);}

  h1.screen-title{font-size:20px; margin:4px 0 14px; color:var(--navy);}
  .card{background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--line);}

  /* Home */
  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px;}
  @media(min-width:700px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:#fff; border-radius:var(--radius); padding:16px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .kpi .val{font-size:28px; font-weight:800; color:var(--navy);}
  .kpi .lab{font-size:12px; color:var(--grey); margin-top:2px; font-weight:600;}
  .kpi.warn .val{color:var(--amber);}
  .kpi.bad .val{color:var(--red);}

  .bigbtn{display:flex; align-items:center; gap:14px; width:100%; padding:20px; border-radius:var(--radius);
    border:none; font-size:17px; font-weight:700; color:#fff; background:var(--navy); margin-bottom:12px; min-height:72px;}
  .bigbtn .ic{font-size:26px;}
  .bigbtn.secondary{background:#fff; color:var(--navy); border:2px solid var(--navy);}
  .bigbtn:active{filter:brightness(.92);}

  /* Form */
  label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--grey); margin:14px 0 6px;}
  input,select,textarea{width:100%; padding:14px; font-size:16px; border:2px solid var(--line); border-radius:10px; background:#fff; font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--blue);}
  textarea{min-height:70px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:12px; color:var(--grey); margin-top:4px;}
  .err{color:var(--red); font-size:13px; font-weight:700; margin-top:6px;}
  .readonly{background:var(--grey-light); color:var(--grey);}
  .calc-box{background:var(--green-light); border:2px solid var(--green); border-radius:10px; padding:14px; text-align:center; margin-top:8px;}
  .calc-box .num{font-size:30px; font-weight:800; color:var(--green);}
  .calc-box.bad{background:var(--red-light); border-color:var(--red);}
  .calc-box.bad .num{color:var(--red);}

  /* Signature pad */
  .sig-wrap{border:2px dashed var(--line); border-radius:10px; background:#fff; overflow:hidden; touch-action:none;}
  canvas.sigpad{display:block; width:100%; height:170px; touch-action:none; background:#fff;}
  .sig-actions{display:flex; gap:10px; margin-top:8px;}
  .sig-actions button{flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:#fff; font-weight:700; font-size:13px;}

  .photo-box{border:2px dashed var(--line); border-radius:10px; padding:16px; text-align:center;}
  .photo-box img{max-width:100%; max-height:180px; border-radius:8px; margin-top:10px;}
  .photo-btn{display:inline-block; background:var(--blue-light); color:var(--navy); font-weight:700; padding:12px 18px; border-radius:10px; margin-top:6px;}

  .submitbar{position:fixed; bottom:64px; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; z-index:40;}
  .submitbar .inner{max-width:980px; margin:0 auto;}
  .submitbtn{width:100%; padding:18px; border-radius:12px; border:none; background:var(--green); color:#fff; font-size:17px; font-weight:800;}
  .submitbtn:disabled{background:#B8C0CC;}

  /* List */
  .filterbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .filterbar input,.filterbar select{flex:1; min-width:140px;}
  .ticket-row{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .ticket-row .info b{font-size:15px; color:var(--navy);}
  .ticket-row .info .sub{font-size:12px; color:var(--grey); margin-top:2px;}
  .badge{font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px; white-space:nowrap;}
  .badge-valido{background:var(--green-light); color:var(--green);}
  .badge-pendiente{background:var(--amber-light); color:var(--amber);}
  .badge-anulado{background:var(--red-light); color:var(--red);}
  .ticket-row .gal{font-weight:800; font-size:16px; color:var(--navy); min-width:60px; text-align:right;}
  .empty{text-align:center; padding:50px 20px; color:var(--grey);}
  .empty .ic{font-size:40px; margin-bottom:10px;}

  /* Detail modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:20px;}
  .modal h2{color:var(--navy); margin-top:0;}
  .modal .field{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .modal .field b{color:var(--grey); font-weight:600;}
  .modal .close{display:block; margin:16px auto 0; padding:12px 26px; border-radius:10px; border:2px solid var(--line); background:#fff; font-weight:700;}
  .modal .anular{display:block; width:100%; margin-top:10px; padding:14px; border-radius:10px; border:none; background:var(--red); color:#fff; font-weight:700;}

  /* Consolidado */
  .summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px;}
  .printable table{width:100%; border-collapse:collapse; font-size:12px;}
  .printable th{background:var(--navy); color:#fff; padding:6px; text-align:left;}
  .printable td{padding:6px; border-bottom:1px solid var(--line);}
  @media print{
    header.topbar, nav.bottomnav, .no-print{display:none !important;}
    main{padding:0; max-width:100%;}
    body{background:#fff;}
  }
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:12px 20px; border-radius:30px; font-weight:700; font-size:14px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.2);}

  /* Dashboard ampliado */
  .section-title{font-size:14px; font-weight:800; color:var(--navy); margin:18px 0 10px; text-transform:uppercase; letter-spacing:.4px;}
  .kpi.fuel .val{color:var(--green);} .kpi.fuel{border-color:#BFE3CD;}
  .kpi.ticket .val{color:var(--blue);} .kpi.ticket{border-color:#D6D6D4;}
  .chart-card{background:#fff; border-radius:var(--radius); padding:16px; border:1px solid var(--line); margin-bottom:14px;}
  .chart-card .title{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:10px;}
  .compare-row{display:flex; gap:16px; align-items:center; justify-content:center; margin-top:8px;}
  .compare-box{text-align:center;}
  .compare-box .v{font-size:22px; font-weight:800; color:var(--navy);}
  .compare-box .l{font-size:11px; color:var(--grey);}
  .compare-arrow{font-size:20px; font-weight:800;}
  .compare-up{color:var(--green);} .compare-down{color:var(--red);}

  /* Filtros avanzados */
  .filters-toggle{background:var(--blue-light); color:var(--navy); border:none; border-radius:10px; padding:12px; font-weight:700; width:100%; margin-bottom:10px;}
  .filters-panel{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; display:none;}
  .filters-panel.open{display:block;}
  .filters-panel .row2{margin-bottom:8px;}
  .filters-panel label{margin:8px 0 4px;}
  .export-row{display:flex; gap:10px; margin-top:10px;}
  .export-row button{flex:1; padding:13px; border-radius:10px; border:2px solid var(--navy); background:#fff; color:var(--navy); font-weight:700; font-size:13px;}

  /* Buscador con autocompletado (placa, cédula, nombres, etc.) */
  .ac-wrap{position:relative;}
  .ac-wrap input{padding-right:34px;}
  .ac-clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--grey); font-size:18px; font-weight:700; padding:6px 8px; line-height:1; display:none;}
  .ac-wrap.has-value .ac-clear{display:block;}
  .ac-list{position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border:2px solid var(--blue);
    border-radius:10px; max-height:230px; overflow-y:auto; z-index:80; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none;
    -webkit-overflow-scrolling:touch;}
  .ac-list.open{display:block;}
  .ac-item{padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item b{color:var(--navy);}
  .ac-item .sub{font-size:12px; color:var(--grey); margin-top:2px;}
  .ac-item.active,.ac-item:active{background:var(--blue-light);}
  .ac-empty{padding:14px; color:var(--grey); font-size:13px; text-align:center;}
  .ac-valid{border-color:var(--green) !important;}
  .ac-invalid{border-color:var(--red) !important;}

  /* Settings / header icon */
  #settingsBtn{background:none; border:none; color:var(--navy); font-size:20px; margin-left:8px; padding:4px; display:none;}
  .settings-modal textarea, .settings-modal input{margin-bottom:4px;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .pill-sent{background:var(--green-light); color:var(--green);}
  .pill-pending{background:var(--amber-light); color:var(--amber);}
  .pill-failed{background:var(--red-light); color:var(--red);}
  .audit-row{font-size:12px; padding:8px 0; border-bottom:1px solid var(--line);}
  .audit-row .a-action{font-weight:700; color:var(--navy);}
  .audit-row .a-meta{color:var(--grey); margin-top:2px;}

  /* Login */
  .login-screen{position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .login-card{background:#fff; border-radius:18px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .login-card h1{font-size:18px; color:var(--navy); margin:0 0 4px;}
  .login-card .sub{font-size:12px; color:var(--grey); margin-bottom:20px;}
  .login-card label{margin-top:14px;}
  .login-btn{width:100%; margin-top:20px; padding:16px; border-radius:12px; border:none; background:var(--navy); color:#fff; font-size:16px; font-weight:800;}
  .login-err{color:var(--red); font-size:13px; font-weight:700; margin-top:10px; text-align:center; display:none;}
  .logout-btn{display:block; width:100%; margin-top:10px; padding:12px; border-radius:10px; border:2px solid var(--red); background:#fff; color:var(--red); font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img id="headerLogo" alt="Tecknologistic S.A."><span>Sistema de Gestión Integrado · Control de Combustible · Livianos · Bloque 61</span></div>
    <div style="display:flex; align-items:center;">
      <div id="connBadge" class="conn-on">● En línea</div>
      <button id="settingsBtn" title="Configuración">⚙️</button>
    </div>
  </header>
  <main id="main"></main>
  <div id="submitbarHolder"></div>
  <nav class="bottomnav">
    <button data-screen="home" class="active"><span class="ic">🏠</span>Inicio</button>
    <button data-screen="new"><span class="ic">➕</span>Nuevo</button>
    <button data-screen="list"><span class="ic">📋</span>Tickets</button>
    <button data-screen="consolidado"><span class="ic">🧾</span>Consolidado</button>
  </nav>
</div>

/* ===================== UTILIDADES DE FECHA ===================== */
function pad2(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function mondayOfWeek(dateObj){
  const day = dateObj.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const m = new Date(dateObj);
  m.setDate(dateObj.getDate()+diff);
  return ymd(m);
}
function rangeBounds(period){
  const now = new Date();
  const today = todayStr();
  if(period==="hoy") return {from: today, to: today};
  if(period==="semana") return {from: mondayOfWeek(now), to: today};
  if(period==="mes") return {from: today.slice(0,7)+"-01", to: today};
  if(period==="anio") return {from: today.slice(0,4)+"-01-01", to: today};
  return {from:"0000-01-01", to:"9999-12-31"};
}

/* ===================== KPIs ACUMULADOS ===================== */
function computeKPIs(){
  const validos = tickets.filter(t=>t.estado==="Válido");
  function sumGal(period){
    const {from,to} = rangeBounds(period);
    return validos.filter(t=>t.fecha>=from && t.fecha<=to).reduce((s,t)=>s+(parseFloat(t.galones)||0),0);
  }
  function countT(period){
    const {from,to} = rangeBounds(period);
    return tickets.filter(t=>t.fecha>=from && t.fecha<=to).length;
  }
  return {
    galHoy: sumGal("hoy"), galSemana: sumGal("semana"), galMes: sumGal("mes"), galAnio: sumGal("anio"),
    tkHoy: countT("hoy"), tkSemana: countT("semana"), tkMes: countT("mes"), tkAnio: countT("anio")
  };
}
function lastNDaysGalones(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = ymd(d);
    const gal = tickets.filter(t=>t.estado==="Válido" && t.fecha===ds).reduce((s,t)=>s+(parseFloat(t.galones)||0),0);
    out.push({label: pad2(d.getDate())+"/"+pad2(d.getMonth()+1), value: gal});
  }
  return out;
}
function monthlyTotals(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+"-"+pad2(d.getMonth()+1);
    const gal = tickets.filter(t=>t.estado==="Válido" && t.fecha.startsWith(ym)).reduce((s,t)=>s+(parseFloat(t.galones)||0),0);
    const labels = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    out.push({label: labels[d.getMonth()], value: gal});
  }
  return out;
}

/* ===================== GRÁFICOS SIMPLES (canvas, sin dependencias) ===================== */
function drawBarChart(canvas, data){
  const ctx = canvas.getContext("2d");
  const ratio = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*ratio; canvas.height = rect.height*ratio;
  ctx.scale(ratio,ratio);
  const w = rect.width, h = rect.height, pad=24;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...data.map(d=>d.value));
  const bw = (w-pad*2)/data.length;
  ctx.font = "10px Arial"; ctx.fillStyle="#595959"; ctx.textAlign="center";
  data.forEach((d,i)=>{
    const bh = (h-pad*2) * (d.value/max);
    const x = pad + i*bw + bw*0.2;
    const y = h-pad-bh;
    ctx.fillStyle = "#A93B3C";
    ctx.fillRect(x, y, bw*0.6, bh);
    ctx.fillStyle = "#595959";
    ctx.fillText(d.label, x+bw*0.3, h-8);
    if(d.value>0){ ctx.fillStyle="#A93B3C"; ctx.font="9px Arial"; ctx.fillText(d.value.toFixed(0), x+bw*0.3, y-4); ctx.font="10px Arial"; }
  });
}

function queueEmail(tipo, refId, asunto, cuerpoParams){
  const item = { uid: tipo+"_"+refId+"_"+Date.now(), tipo, refId, asunto, params: cuerpoParams,
    estado:"pendiente", intentos:0, fechaCreado: new Date().toISOString(), fechaEnvio:null };
  emailQueue.push(item);
  saveEmailQueue();
  logAudit("Email encolado", refId, asunto+" → "+emailConfig.recipients.join(", "));
  processEmailQueue();
}

async function processEmailQueue(){
  if(!online || !emailConfig.enabled || !emailConfig.serviceId || !emailConfig.templateId || !emailConfig.publicKey || !window.emailjs) return;
  for(const item of emailQueue){
    if(item.estado==="enviado") continue;
    if(item.intentos>=5){ item.estado="fallido"; continue; }
    try{
      item.intentos++;
      for(const to of emailConfig.recipients){
        await emailjs.send(emailConfig.serviceId, emailConfig.templateId, { to_email: to, ...item.params });
      }
      item.estado = "enviado";
      item.fechaEnvio = new Date().toISOString();
      logAudit("Email enviado", item.refId, item.asunto+" → "+emailConfig.recipients.join(", "));
    }catch(e){
      item.estado = "pendiente";
      logAudit("Email fallido", item.refId, "Intento "+item.intentos+": "+(e && e.text ? e.text : "error de envío"));
    }
  }
  saveEmailQueue();
}

/* ===================== STORAGE =====================
   Configuración pequeña (email, Drive, auditoría) sigue en localStorage.
   Los TICKETS (pesados por fotos/firmas) se guardan en IndexedDB, que en
   cualquier navegador moderno permite cientos de MB — muy por encima del
   límite típico de 5-10 MB de localStorage que antes truncaba respaldos
   grandes. Nunca se borra nada automáticamente. */
const LS_INDEX_KEY = "tcf_ticket_index";     // usado solo para migrar datos antiguos
const LS_TICKET_PREFIX = "tcf_ticket_";      // usado solo para migrar datos antiguos
let useLocalStorage = false;
const memoryStore = {}; // respaldo si localStorage no está disponible (ej. vista previa en sandbox)

function detectStorage(){
  try{
    if(typeof window === "undefined" || !window.localStorage) return false;
    const k = "__tcf_test__";
    window.localStorage.setItem(k,"1");
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

function lsGet(key){
  try{
    return useLocalStorage ? window.localStorage.getItem(key) : (memoryStore[key] || null);
  }catch(e){ return memoryStore[key] || null; }
}
function lsSet(key, val){
  try{
    if(useLocalStorage) window.localStorage.setItem(key, val);
    else memoryStore[key] = val;
  }catch(e){ memoryStore[key] = val; }
}

/* ---------- IndexedDB: almacenamiento principal de tickets ---------- */
const IDB_NAME = "tcf_combustible_db";
const IDB_VERSION = 1;
const IDB_STORE = "tickets";
let idbInstance = null;
let idbAvailable = true;

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(idbInstance){ resolve(idbInstance); return; }
    if(!window.indexedDB){ reject(new Error("IndexedDB no disponible en este navegador")); return; }
    let req;
    try{ req = window.indexedDB.open(IDB_NAME, IDB_VERSION); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"id"});
    };
    req.onsuccess = (e)=>{ idbInstance = e.target.result; resolve(idbInstance); };
    req.onerror = (e)=> reject(e.target.error || new Error("Error abriendo IndexedDB"));
  });
}
async function idbGetAll(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = (e)=> reject(e.target.error);
  });
}
async function idbPut(ticket){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(ticket);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = (e)=> reject(e.target.error);
    tx.onabort = (e)=> reject(e.target.error || new Error("Transacción abortada (posible falta de espacio)"));
  });
}
async function idbHas(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).getKey(id);
    req.onsuccess = ()=> resolve(req.result !== undefined);
    req.onerror = (e)=> reject(e.target.error);
  });
}

/* Migra UNA sola vez, de forma aditiva, cualquier ticket que haya quedado
   guardado en localStorage por versiones anteriores de la app. Nunca borra
   los datos antiguos de localStorage; solo los copia a IndexedDB si aún
   no están ahí. */
async function migrateLegacyLocalStorageTickets(){
  try{
    const idxRaw = lsGet(LS_INDEX_KEY);
    const ids = idxRaw ? JSON.parse(idxRaw) : [];
    if(!ids.length) return {migrated:0};
    let migrated = 0;
    for(const id of ids){
      let already = false;
      try{ already = await idbHas(id); }catch(e){}
      if(already) continue;
      const raw = lsGet(LS_TICKET_PREFIX+id);
      if(raw){
        try{ await idbPut(JSON.parse(raw)); migrated++; }catch(e){}
      }
    }
    return {migrated};
  }catch(e){ return {migrated:0}; }
}

async function loadTickets(){
  useLocalStorage = detectStorage();
  try{ await idbOpen(); idbAvailable = true; }
  catch(e){ idbAvailable = false; }

  if(!idbAvailable){
    toast("⚠ Este navegador no soporta IndexedDB; se usará almacenamiento limitado (5-10 MB) y podría quedarse sin espacio con fotos/firmas.");
  }
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}

  try{
    if(idbAvailable){
      await migrateLegacyLocalStorageTickets();
      const loaded = await idbGetAll();
      loaded.sort((a,b)=> (b.id||"").localeCompare(a.id||""));
      tickets = loaded;
    } else {
      // Respaldo con el esquema antiguo (localStorage) si IndexedDB no existe
      const idxRaw = lsGet(LS_INDEX_KEY);
      const ids = idxRaw ? JSON.parse(idxRaw) : [];
      const loaded = [];
      for(const id of ids){
        const raw = lsGet(LS_TICKET_PREFIX+id);
        if(raw){ try{ loaded.push(JSON.parse(raw)); }catch(e){} }
      }
      loaded.sort((a,b)=> (b.id||"").localeCompare(a.id||""));
      tickets = loaded;
    }
  }catch(e){ tickets = []; }
}

async function saveTicket(t){
  if(idbAvailable){
    try{ await idbPut(t); return; }catch(e){ /* cae al respaldo de abajo */ }
  }
  lsSet(LS_TICKET_PREFIX+t.id, JSON.stringify(t));
  const idxRaw = lsGet(LS_INDEX_KEY);
  let ids = idxRaw ? JSON.parse(idxRaw) : [];
  if(!ids.includes(t.id)) ids.push(t.id);
  lsSet(LS_INDEX_KEY, JSON.stringify(ids));
}

/* ===================== RESPALDO: EXPORTAR / IMPORTAR =====================
   Regla permanente Tecknologistic: nunca borrar datos existentes; toda
   importación debe ser aditiva (no destructiva) y dejar constancia de
   qué se guardó y qué no. */
function exportBackup(){
  const payload = { exportadoEn: new Date().toISOString(), version: 1, tickets: tickets };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Respaldo_Combustible_"+todayStr()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  logAudit("Respaldo exportado", "", tickets.length+" tickets");
  toast("✅ Respaldo exportado ("+tickets.length+" tickets).");
}

/* Inserta tickets de un respaldo SIN modificar ni sobrescribir los que ya
   existan localmente, guardándolos en IndexedDB (gran capacidad), y
   reporta con precisión cualquier ticket que no haya podido guardarse. */
async function mergeTicketsIntoStorage(list){
  let added=0, skippedExisting=0, failedQuota=0;
  const failedIds=[];
  for(const t of list){
    if(!t || !t.id) continue;
    let already = false;
    try{ already = idbAvailable ? await idbHas(t.id) : false; }catch(e){ already = false; }
    if(already){ skippedExisting++; continue; } // nunca toca lo ya guardado
    try{
      if(idbAvailable){ await idbPut(t); }
      else {
        const key = LS_TICKET_PREFIX+t.id;
        const json = JSON.stringify(t);
        lsSet(key, json);
        if(useLocalStorage && window.localStorage.getItem(key) !== json) throw new Error("no persistido");
      }
      added++;
    }catch(e){ failedQuota++; failedIds.push(t.id); }
  }
  return {added, skippedExisting, failedQuota, failedIds};
}

async function importBackupFile(file){
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ toast("⚠ El archivo no es un JSON válido."); return; }
  const incoming = Array.isArray(data) ? data : (Array.isArray(data.tickets) ? data.tickets : null);
  if(!incoming){ toast("⚠ El archivo no tiene el formato esperado (falta 'tickets')."); return; }
  toast("⏳ Importando "+incoming.length+" tickets…");
  const r = await mergeTicketsIntoStorage(incoming);
  await loadTickets();
  render();
  const parts = [];
  if(r.added) parts.push(r.added+" importados");
  if(r.skippedExisting) parts.push(r.skippedExisting+" ya existían (sin modificar)");
  if(r.failedQuota) parts.push(r.failedQuota+" no cupieron por espacio del navegador");
  logAudit("Respaldo importado", "", parts.join(" · "));
  toast((r.failedQuota?"⚠ ":"✅ ")+(parts.join(" · ")||"Nada nuevo para importar"));
  if(r.failedQuota){
    setTimeout(()=>{
      alert("Atención: "+r.failedQuota+" ticket(s) no se pudieron guardar de forma permanente porque el navegador no tiene espacio suficiente (localStorage lleno por firmas/fotos pesadas).\n\nIDs afectados:\n"+r.failedIds.join(", ")+"\n\nNo se perdió ni modificó ningún dato existente. Puede volver a intentar en un navegador con más espacio libre, o liberar espacio y reintentar solo con esos IDs.");
    }, 300);
  }
}

function makeOptions(arr, mapFn){
  return ['<option value="">— Seleccionar —</option>'].concat(arr.map(mapFn)).join("");
}

/* ===================== BUSCADOR / AUTOCOMPLETADO GENÉRICO =====================
   Permite escribir las primeras letras o números (placa, cédula, nombre) y ver
   todas las coincidencias, sin necesidad de desplazarse por listas largas.
*/
function acHTML(id, placeholder, value){
  return `<div class="ac-wrap" id="${id}_wrap">
    <input type="text" id="${id}" autocomplete="off" autocorrect="off" autocapitalize="characters"
      spellcheck="false" placeholder="${placeholder}" value="${value||""}" />
    <button type="button" class="ac-clear" id="${id}_clear">✕</button>
    <div class="ac-list" id="${id}_list"></div>
  </div>`;
}

/**
 * items: array de objetos fuente (ej. VEHICULOS, CONDUCTORES)
 * opts.getLabel(item) -> texto principal mostrado y guardado como valor final
 * opts.getSub(item) -> texto secundario opcional (ej. empresa, cédula)
 * opts.matchFields(item) -> array de strings sobre los que se busca (letras/números)
 * opts.onSelect(item|null) -> callback cuando se elige un ítem o se limpia el campo
 * opts.allowFree -> si true, no exige que el valor final exista en la lista (para filtros "todos")
 */
function initAC(id, items, opts){
  const input = document.getElementById(id);
  const wrap = document.getElementById(id+"_wrap");
  const list = document.getElementById(id+"_list");
  const clearBtn = document.getElementById(id+"_clear");
  if(!input) return null;
  let activeIndex = -1;
  let currentMatches = [];

  function norm(s){
    return (s||"").toString().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,""); // ignora tildes
  }

  function matches(query){
    const q = norm(query).trim();
    if(!q) return items.slice(0,50);
    // Prioriza coincidencias que EMPIEZAN con lo escrito, luego las que lo contienen
    const starts = [], contains = [];
    items.forEach(it=>{
      const fields = opts.matchFields(it).map(norm);
      if(fields.some(f=>f.startsWith(q))) starts.push(it);
      else if(fields.some(f=>f.includes(q))) contains.push(it);
    });
    return starts.concat(contains).slice(0,50);
  }

  function markValidity(){
    wrap.classList.toggle("has-value", !!input.value);
    if(opts.allowFree){ input.classList.remove("ac-valid","ac-invalid"); return; }
    if(!input.value){ input.classList.remove("ac-valid","ac-invalid"); return; }
    const exact = items.find(it=> norm(opts.getLabel(it))===norm(input.value));
    input.classList.toggle("ac-valid", !!exact);
    input.classList.toggle("ac-invalid", !exact);
  }

  function renderList(){
    if(currentMatches.length===0){
      list.innerHTML = `<div class="ac-empty">Sin coincidencias</div>`;
    }else{
      list.innerHTML = currentMatches.map((it,i)=>{
        const sub = opts.getSub ? opts.getSub(it) : "";
        return `<div class="ac-item${i===activeIndex?" active":""}" data-i="${i}"><b>${opts.getLabel(it)}</b>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
      }).join("");
    }
    list.classList.add("open");
    list.querySelectorAll(".ac-item").forEach(el=>{
      // pointerdown en vez de click: dispara antes que el blur, funciona igual en iOS y Android
      el.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        selectItem(currentMatches[parseInt(el.dataset.i,10)]);
      });
    });
  }

  function openList(){
    currentMatches = matches(input.value);
    activeIndex = -1;
    renderList();
  }

  function closeList(){ list.classList.remove("open"); }

  function selectItem(it){
    input.value = opts.getLabel(it);
    markValidity();
    closeList();
    if(opts.onSelect) opts.onSelect(it);
  }

  input.addEventListener("input", ()=>{ openList(); markValidity(); if(opts.onSelect && !opts.allowFree) opts.onSelect(null); });
  input.addEventListener("focus", openList);
  input.addEventListener("blur", ()=>{
    setTimeout(()=>{
      closeList();
      if(!opts.allowFree){
        const exact = items.find(it=> norm(opts.getLabel(it))===norm(input.value));
        if(exact && opts.getLabel(exact)!==input.value){ input.value = opts.getLabel(exact); }
      }
      markValidity();
    }, 180);
  });
  input.addEventListener("keydown", (e)=>{
    if(!list.classList.contains("open")) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, currentMatches.length-1); renderList(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); renderList(); }
    else if(e.key==="Enter"){ e.preventDefault(); if(activeIndex>=0 && currentMatches[activeIndex]) selectItem(currentMatches[activeIndex]); }
    else if(e.key==="Escape"){ closeList(); input.blur(); }
  });
  clearBtn.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    input.value = "";
    markValidity();
    if(opts.onSelect) opts.onSelect(null);
    input.focus();
    openList();
  });
  // Nota: el cierre al tocar fuera ya lo cubre el "blur" del input (abajo);
  // se evita añadir un listener global en document en cada render para no
  // acumular manejadores al re-visitar pantallas repetidamente.

  markValidity();
  return {
    getExact(){ return items.find(it=> norm(opts.getLabel(it))===norm(input.value)) || null; },
    setValue(v){ input.value = v||""; markValidity(); }
  };
}

function setupSignaturePad(canvas){
  const ctx = canvas.getContext("2d");
  let hasInk = false;
  let drawing = false;
  let last = null;
  let activePointerId = null;

  function applyStrokeStyle(){
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1B1F27";
  }

  // Redimensiona el lienzo conservando el trazo ya dibujado (evita que se borre
  // o se vea deformado al girar el dispositivo o al abrirse/cerrarse el teclado).
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if(rect.width===0 || rect.height===0) return;
    let prevImage = null;
    if(canvas.width>0 && canvas.height>0){
      try{ prevImage = canvas.toDataURL("image/png"); }catch(e){ prevImage = null; }
    }
    canvas.width = rect.width*ratio;
    canvas.height = rect.height*ratio;
    ctx.setTransform(1,0,0,1,0,0); // evita acumular escalas en resises sucesivos
    ctx.scale(ratio, ratio);
    applyStrokeStyle();
    if(prevImage && hasInk){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = prevImage;
    }
  }
  resize();

  let resizeTimer = null;
  const onWinResize = ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); };
  window.addEventListener("resize", onWinResize);
  window.addEventListener("orientationchange", onWinResize);

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return {x: e.clientX-rect.left, y: e.clientY-rect.top};
  }

  function start(e){
    e.preventDefault();
    // Ignora un segundo dedo/puntero mientras ya se está firmando (evita saltos de línea)
    if(activePointerId!==null && e.pointerId!==undefined && e.pointerId!==activePointerId) return;
    activePointerId = e.pointerId!==undefined ? e.pointerId : "mouse";
    if(canvas.setPointerCapture && e.pointerId!==undefined){
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    }
    drawing = true;
    last = pos(e);
  }
  function move(e){
    if(!drawing) return;
    if(e.pointerId!==undefined && e.pointerId!==activePointerId) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasInk = true;
  }
  function end(e){
    if(e && e.pointerId!==undefined && e.pointerId!==activePointerId) return;
    drawing = false;
    activePointerId = null;
  }

  if(window.PointerEvent){
    // Pointer Events: cubre dedo, mouse y lápiz (stylus) de forma unificada en
    // Android e iOS/Safari 13+, incluida la captura del puntero fuera del lienzo.
    canvas.style.touchAction = "none";
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end); // ej. llamada entrante, gesto del sistema
    canvas.addEventListener("pointerleave", (e)=>{ if(e.buttons===0) end(e); });
  } else {
    // Respaldo para navegadores muy antiguos sin soporte de Pointer Events
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, {passive:false});
    canvas.addEventListener("touchmove", move, {passive:false});
    canvas.addEventListener("touchend", end);
    canvas.addEventListener("touchcancel", end);
  }

  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; },
    isEmpty(){ return !hasInk; },
    dataURL(){ return canvas.toDataURL("image/png"); },
    destroy(){ window.removeEventListener("resize", onWinResize); window.removeEventListener("orientationchange", onWinResize); }
  };
}

async function onSaveTicket(){
  const get = id => document.getElementById(id).value;
  const cIni = parseFloat(get("f_cIni")), cFin = parseFloat(get("f_cFin"));

  if(!get("f_empresa")||!get("f_placa")||!get("f_conductor")||!get("f_autorizado")){
    toast("⚠ Complete empresa, placa, conductor y autorizado"); return;
  }
  // Los campos de búsqueda deben corresponder a una coincidencia real de la lista maestra
  const normAC = s=>(s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(!VEHICULOS.some(v=>normAC(v[0])===normAC(get("f_placa")))){
    toast("⚠ Seleccione una placa válida de la lista sugerida"); document.getElementById("f_placa").focus(); return;
  }
  if(!CONDUCTORES.some(c=>normAC(c[1])===normAC(get("f_conductor")))){
    toast("⚠ Seleccione un conductor válido de la lista sugerida"); document.getElementById("f_conductor").focus(); return;
  }
  if(!EMPRESAS.some(e=>normAC(e)===normAC(get("f_empresa")))){
    toast("⚠ Seleccione una empresa válida de la lista sugerida"); document.getElementById("f_empresa").focus(); return;
  }
  if(!AUTORIZADORES.some(a=>normAC(a)===normAC(get("f_autorizado")))){
    toast("⚠ Seleccione un autorizador válido de la lista sugerida"); document.getElementById("f_autorizado").focus(); return;
  }
  if(isNaN(cIni)||isNaN(cFin)){ toast("⚠ Ingrese contador inicial y final"); return; }
  if(cFin <= cIni){ toast("⚠ El contador final debe ser mayor al inicial"); return; }
  if(sigConductorPad.isEmpty()){ toast("⚠ Falta la firma del conductor"); return; }
  if(sigAutorizadoPad.isEmpty()){ toast("⚠ Falta la firma del autorizado"); return; }

  const ticket = {
    id: get("f_numTicket"),
    numNota: get("f_numTicket"),
    fecha: get("f_fecha"),
    empresa: get("f_empresa"),
    segmento: get("f_segmento"),
    pozo: get("f_pozo"),
    equipo: get("f_equipo"),
    placa: get("f_placa"),
    km: get("f_km"),
    conductor: get("f_conductor"),
    cedula: get("f_cedula"),
    autorizado: get("f_autorizado"),
    contadorInicial: cIni,
    contadorFinal: cFin,
    galones: (cFin-cIni).toFixed(1),
    observaciones: get("f_obs"),
    estado: "Válido",
    firmaConductor: sigConductorPad.dataURL(),
    firmaAutorizado: sigAutorizadoPad.dataURL(),
    foto: photoData,
    creadoPor: (currentUser?currentUser.user:"desconocido"),
    fechaCreacion: new Date().toISOString(),
    motivoAnulacion: ""
  };

  try{
    await saveTicket(ticket);
    tickets.unshift(ticket);
    logAudit("Ticket creado", ticket.id, ticket.placa+" · "+ticket.conductor+" · "+ticket.galones+" gal");
    queueEmail("ticket", ticket.id, "Ticket de Combustible "+ticket.id+" | "+fmtDateEs(ticket.fecha)+" | "+ticket.placa+" | "+ticket.conductor, emailParamsForTicket(ticket));
    toast("✅ Ticket "+ticket.id+" guardado");
    setScreen("list");
  }catch(e){
    console.error(e);
    toast("⚠ No se pudo guardar (almacenamiento bloqueado o lleno). Revise modo privado/incógnito.");
  }
}

      const matchQ = !q || (t.placa||"").toLowerCase().includes(q) || (t.conductor||"").toLowerCase().includes(q) || (t.id||"").toLowerCase().includes(q);
      const matchE = !fe || t.estado===fe;
      const matchDesde = !desde || t.fecha>=desde;
      const matchHasta = !hasta || t.fecha<=hasta;
      const matchPlaca = !fPlaca || (t.placa||"").toLowerCase().includes(fPlaca);
      const matchCond = !fConductor || (t.conductor||"").toLowerCase().includes(fConductor) || (t.cedula||"").toLowerCase().includes(fConductor);
      const matchAuto = !fAutorizado || (t.autorizado||"").toLowerCase().includes(fAutorizado);
      const matchEmp = !fEmpresa || (t.empresa||"").toLowerCase().includes(fEmpresa);
      return matchQ && matchE && matchDesde && matchHasta && matchPlaca && matchCond && matchAuto && matchEmp;
    });
  }

  function drawList(){
    let list = getFiltered();
    const holder = document.getElementById("listHolder");
    if(list.length===0){
      holder.innerHTML = `<div class="empty"><div class="ic">📭</div>No hay tickets que coincidan.<br>Cree uno nuevo desde el botón ➕ Nuevo.</div>`;
      return;
    }
    holder.innerHTML = list.map(t=>{
      const badgeClass = t.estado==="Válido"?"badge-valido":(t.estado==="Anulado"?"badge-anulado":"badge-pendiente");
      return `<div class="ticket-row" data-id="${t.id}">
        <div class="info">
          <b>${t.id} — ${t.placa}</b>
          <div class="sub">${t.conductor} · ${t.empresa} · ${fmtDateEs(t.fecha)}</div>

        <span class="badge ${badgeClass}">${t.estado}</span>
        <div class="gal">${t.estado==="Anulado"?"—":t.galones+" gl"}</div>
      </div>`;
    }).join("");
    holder.querySelectorAll(".ticket-row").forEach(row=>{
      row.addEventListener("click", ()=> openDetail(row.dataset.id));
    });
  }
}

/* ===================== EXPORTAR A GOOGLE DRIVE ===================== */
const LS_DRIVE_CONFIG = "tcf_drive_config";
let driveConfig = { clientId:"", enabled:false };
let driveTokenClient = null;
let driveAccessToken = null;
let driveTokenExpiry = 0;

function loadDriveConfig(){
  try{ const raw = lsGet(LS_DRIVE_CONFIG); if(raw) driveConfig = JSON.parse(raw); }catch(e){}
}
function saveDriveConfig(){ lsSet(LS_DRIVE_CONFIG, JSON.stringify(driveConfig)); }

function ensureDriveTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    throw new Error("El módulo de Google no se ha cargado (requiere conexión a internet).");
  }
  if(!driveConfig.clientId){
    throw new Error("Falta configurar el Client ID de Google en Configuración ⚙️.");
  }
  if(!driveTokenClient){
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: driveConfig.clientId,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: ()=>{} // se sobreescribe por invocación
    });
  }
  return driveTokenClient;
}

function getDriveAccessToken(){
  return new Promise((resolve, reject)=>{
    try{
      const tokenClient = ensureDriveTokenClient();
      if(driveAccessToken && Date.now() < driveTokenExpiry - 30000){
        resolve(driveAccessToken);
        return;
      }
      tokenClient.callback = (resp)=>{
        if(resp && resp.access_token){
          driveAccessToken = resp.access_token;
          driveTokenExpiry = Date.now() + (resp.expires_in||3300)*1000;
          resolve(driveAccessToken);
        }else{
          reject(new Error("No se pudo autenticar con Google Drive."));
        }
      };
      tokenClient.requestAccessToken({ prompt: driveAccessToken ? "" : "consent" });
    }catch(e){
      reject(e);
    }
  });
}

async function uploadBlobToDrive(blob, filename, mimeType){
  const token = await getDriveAccessToken();
  const metadata = { name: filename, mimeType: mimeType };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], {type:"application/json"}));
  form.append("file", blob);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + token },
    body: form
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error("Drive respondió "+res.status+": "+errText);
  }
  return res.json();
}

function buildTicketsWorkbook(list){
  const rows = list.map(t=>({
    "N° Ticket": t.id, "Fecha": t.fecha, "Empresa/Proyecto": t.empresa, "Segmento": t.segmento,
    "Placa": t.placa, "Equipo": t.equipo, "Kilometraje": t.km, "Conductor": t.conductor, "Cédula": t.cedula,
    "Autorizado por": t.autorizado, "Contador Inicial": t.contadorInicial, "Contador Final": t.contadorFinal,
    "Galones Entregados": t.estado==="Anulado" ? 0 : parseFloat(t.galones), "Estado": t.estado,
    "Motivo Anulación": t.motivoAnulacion||"", "Observaciones": t.observaciones||""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Tickets");
  return wb;
}

async function exportToDrive(list, customFilename){
  if(!window.XLSX){ toast("⚠ No se pudo cargar el módulo de Excel (requiere conexión a internet)."); return; }
  if(!driveConfig.clientId){ toast("⚠ Configure primero el Client ID de Google Drive en ⚙️ Configuración."); return; }
  const fname = customFilename || ("Combustible_Tickets_"+todayStr()+".xlsx");
  try{
    toast("☁️ Conectando con Google Drive...");
    const wb = buildTicketsWorkbook(list);
    const arrayBuf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const blob = new Blob([arrayBuf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const file = await uploadBlobToDrive(blob, fname, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    logAudit("Exportación a Google Drive", "", list.length+" tickets exportados a "+fname);
    toast("✅ Subido a Google Drive: "+fname);
  }catch(e){
    logAudit("Error exportación Google Drive", "", (e && e.message) || "error desconocido");
    toast("⚠ No se pudo subir a Google Drive: "+((e && e.message) || "error desconocido"));
  }
}

/* Imprime/exporta a PDF SIN salir de la app ni abrir una pestaña nueva.
   Usa un iframe oculto: el diálogo de impresión aparece sobre la misma
   pantalla y, al cerrarlo, el usuario sigue exactamente en el mismo
   módulo (Consolidado, Tickets, etc.) sin necesidad de "regresar". */
function openPrintWindow(title, bodyHTML){
  const old = document.getElementById("printFrame");
  if(old) old.remove();

  const iframe = document.createElement("iframe");
  iframe.id = "printFrame";
  iframe.style.position = "fixed";
  iframe.style.right = "0"; iframe.style.bottom = "0";
  iframe.style.width = "0"; iframe.style.height = "0";
  iframe.style.border = "0"; iframe.style.opacity = "0"; iframe.style.pointerEvents = "none";
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(printWindowHTML(title, bodyHTML));
  doc.close();

  function cleanup(){ setTimeout(()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 300); }

  iframe.onload = ()=>{
    setTimeout(()=>{
      try{
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }catch(e){
        toast("⚠ No se pudo abrir el diálogo de impresión en este navegador.");
      }
    }, 150);
  };
  // 'afterprint' cierra el iframe apenas el usuario imprime/cancela; el timeout
  // es un respaldo por si el navegador móvil no dispara ese evento.
  try{ iframe.contentWindow.addEventListener("afterprint", cleanup); }catch(e){}
  setTimeout(cleanup, 30000);
}

function exportConsolidadoPDF(){
  const today = todayStr();
  const todays = tickets.filter(t=>t.fecha===today);
  const validos = todays.filter(t=>t.estado==="Válido");
  const totalGal = validos.reduce((s,t)=> s + (parseFloat(t.galones)||0), 0);
  const body = `
    <h1>TECKNOLOGISTIC S.A. — Consolidado Diario de Combustible a Livianos</h1>
    <div class="sub">SHAYA Ecuador S.A. (SLB) — Bloque 61 Amazónico — ${fmtDateEs(today)}</div>
    <div class="field"><b>Tickets válidos</b><span>${validos.length}</span></div>
    <div class="field"><b>Tickets anulados</b><span>${todays.length-validos.length}</span></div>
    <div class="field"><b>Total galones entregados</b><span>${totalGal.toFixed(1)}</span></div>
    <table>
      <thead><tr><th>Ticket</th><th>Placa</th><th>Empresa</th><th>Conductor</th><th>Gal.</th><th>Estado</th></tr></thead>
      <tbody>
        ${todays.map(t=>`<tr><td>${t.id}</td><td>${t.placa}</td><td>${t.empresa}</td><td>${t.conductor}</td><td>${t.estado==="Anulado"?"-":t.galones}</td><td>${t.estado}</td></tr>`).join("") || '<tr><td colspan="6" style="text-align:center;color:#999">Sin movimientos hoy</td></tr>'}
      </tbody>
    </table>
    <div class="firmaline">Firma Coordinador de Logística SHAYA: ________________________________</div>
  `;
  openPrintWindow("Consolidado "+today, body);
  logAudit("Consolidado diario generado", "", validos.length+" tickets, "+totalGal.toFixed(1)+" gal");
  queueEmail("reporte", "RPT-"+today, "Reporte Diario de Combustible | "+fmtDateEs(today)+" | Bloque 61", emailParamsForReporte(today, validos, totalGal));
}

    main.innerHTML = `<div class="empty"><div class="ic">⚠️</div>No se pudo iniciar la app en esta vista previa.<br/>Ábrala directamente en el navegador (GitHub Pages o archivo servido por web) para funcionamiento completo.</div>`;

});

  try{
    startApp();
  }catch(e){
    console.error(e);
    const main = document.getElementById("main");
    if(main) main.innerHTML = `<div class="empty"><div class="ic">⚠️</div>Ocurrió un error al iniciar. Recargue la página.</div>`;
  }
})();
